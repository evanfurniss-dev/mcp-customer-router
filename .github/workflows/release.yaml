name: Package release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing router-vVERSION tag to package
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Check tag and version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$RELEASE_TAG" = "router-v$(node -p 'require("./package.json").version')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm build
      - run: pnpm release:package
      - run: pnpm release:smoke
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#router-v}"
          gh release create "$RELEASE_TAG" \
            "release/mcp-customer-router-${version}.tar.gz" \
            "release/mcp-customer-router-${version}.tar.gz.sha256" \
            release/mcp-customer-router.rb \
            --verify-tag --title "Customer MCP Router ${version}" \
            --notes-file docs/RELEASE-NOTES.md
