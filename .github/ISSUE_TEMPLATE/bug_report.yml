name: Bug report
description: Report a router setup or runtime problem.
body:
  - type: markdown
    attributes:
      value: |
        Remove customer names, credentials, authorization URLs, and private settings before posting. Use the security policy for vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a small example with synthetic customer details.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Versions and setup
      description: Include router version, macOS version, AI client and version, and Homebrew or source installation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant error or screenshot
      description: Share only the small, redacted section needed to understand the problem.
